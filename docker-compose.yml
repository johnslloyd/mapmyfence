# Points at a PRE-BUILT image on GitHub Container Registry, not a local
# `build: .` — Hostinger's Docker Manager only pulls publicly hosted
# images, it doesn't build from source itself (that's what triggered
# their "Compose from URL" warning). The image is built and pushed
# automatically by .github/workflows/docker-publish.yml on every push
# to main — nobody needs to run `docker build` by hand.
#
# One-time setup after the first push: the ghcr.io package starts
# PRIVATE by default. Go to github.com -> your profile -> Packages ->
# mapmyfence -> Package settings -> change visibility to Public, or
# Hostinger won't be able to pull it (it can't authenticate).
services:
  app:
    image: ghcr.io/johnslloyd/mapmyfence:latest
    restart: unless-stopped
    ports:
      - "5051:5051"
    environment:
      - NODE_ENV=production
      - PORT=5051
    # Real secrets (DATABASE_URL, SESSION_SECRET, RESEND_API_KEY,
    # EMAIL_FROM) live in a .env file ON THE VPS, next to this compose
    # file — never committed (see .gitignore) and never baked into the
    # image. Create it once on the server: same variables as the
    # non-Docker deployment already documented in CLAUDE.md's
    # "Environment" section, this just points compose at the same file.
    env_file:
      - .env
    # Traefik routing for the temporary sharing/testing subdomain
    # (myyardmanager.johnlloyd.cloud), so it doesn't hit Traefik's
    # default self-signed cert + 404 fallback. entrypoint `websecure`
    # and certresolver `letsencrypt` confirmed correct by Hostinger
    # support for Docker Manager's Traefik setup. Router/service name
    # is `mapmyfence`, matching Hostinger's own example and the actual
    # Docker Manager PROJECT name for this app (still "MapMyFence"
    # there — the in-app rename never touched Hostinger's project
    # naming) rather than this repo's current "myyardmanager" image
    # name, in case Docker Manager expects the two to line up. If
    # nothing changes after redeploying, the next thing to ask
    # Hostinger about is whether this container needs to explicitly
    # join whatever Docker network Traefik itself watches.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mapmyfence.rule=Host(`myyardmanager.johnlloyd.cloud`)"
      - "traefik.http.routers.mapmyfence.entrypoints=websecure"
      - "traefik.http.routers.mapmyfence.tls=true"
      - "traefik.http.routers.mapmyfence.tls.certresolver=letsencrypt"
      - "traefik.http.services.mapmyfence.loadbalancer.server.port=5051"
