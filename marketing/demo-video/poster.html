<!doctype html>
<!-- Poster card for the /pros demo video (design decision 2 in the /pros v2
     spec). Real numbers from the demo recording. Render with:
       node poster.js
     -> client/public/video/postplotter-demo-poster.jpg (1280x800).
     Colors are the live token hex values: --primary #16294B, --background
     #F5F8FA, --accent #FBE5DA. The center stays clear for the page's play
     button. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1280px; height: 800px; background: #16294B; overflow: hidden; }
  .card { position: relative; width: 1280px; height: 800px; color: #F5F8FA; }
  .label {
    position: absolute; top: 64px; left: 80px;
    font: 500 36px/1 "JetBrains Mono", monospace; letter-spacing: 0.06em;
  }
  .price {
    position: absolute; left: 72px; bottom: 92px;
    font: 800 160px/1 "Archivo", sans-serif; letter-spacing: -0.03em;
  }
  .sent {
    position: absolute; left: 80px; bottom: 38px;
    font: 500 40px/1 "JetBrains Mono", monospace; letter-spacing: 0.06em; color: #FBE5DA;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="label">286 FT · CUSTOMER QUOTE</div>
    <div class="price">$8,161.46</div>
    <div class="sent">→ QUOTE SENT</div>
  </div>
</body>
</html>
